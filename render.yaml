# Render Blueprint for the J81 tree (Bot + Analyser + Researcher).
#
# Deploy: push this repo to GitHub → Render → "New +" → "Blueprint" → pick the
# repo. Render reads this file and creates the 3 services + their disks.
#
# The Bot (j81-trade-desk) is the PUBLIC, client-facing URL. It calls the Analyser
# over its public URL; the Researcher feeds the Analyser strategies.
#
# COST/UPTIME: 24/7 (no sleeping) + persistent disks need PAID instances
# (plan: starter, ~$7/mo each). Minimum to run the trading app = j81-trade-desk +
# j81-analyser. j81-researcher is optional (adds strategy gathering) — comment
# it out to save cost.
#
# AFTER FIRST DEPLOY: confirm each service's real URL in the dashboard. If
# Render appended a suffix to a name, update the *_URL env vars below to match.

services:
  # ---------------- BOT (public, client-facing) ----------------
  - type: web
    name: j81-trade-desk
    runtime: docker
    dockerfilePath: ./bot-app/Dockerfile
    dockerContext: ./bot-app
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: j81-trade-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHONUNBUFFERED
        value: "1"
      # Master safety switch. false = REAL money. NOTE: if DRY_RUN is also set in
      # the Render dashboard (Environment tab), the DASHBOARD value WINS — change
      # it there too. Test on a DEMO account first.
      - key: DRY_RUN
        value: "false"
      # Where the Bot reads decisions / scan from (the Analyser service URL).
      - key: ANALYSER_URL
        value: https://j81-analyser.onrender.com
      # STABLE encryption key for stored tokens. Generate once, paste in the
      # dashboard. If this ever changes, previously stored tokens break.
      - key: BOT_ENCRYPTION_KEY
        sync: false
      # Your Deriv app + OAuth (after registering at api.deriv.com/dashboard).
      # DERIV_APP_ID is the OAuth client_id (alphanumeric on the new platform).
      - key: DERIV_APP_ID
        sync: false
      # NUMERIC app_id for the v3 WebSocket (authorize/quote/buy). The new
      # alphanumeric client_id 401s the v3 socket, so this is separate. Leave
      # blank to use Deriv's public "1089" (works, no markup); set your own
      # numeric legacy app_id here to earn markup.
      - key: DERIV_WS_APP_ID
        sync: false
      - key: DERIV_OAUTH_REDIRECT_URI
        value: https://j81-trade-desk.onrender.com/oauth/callback
      # New-platform OAuth2 + PKCE (Ory). These public endpoints (verified via
      # auth.deriv.com/.well-known/openid-configuration) switch the app off the
      # dead legacy login and onto the consent->code->callback flow. Setting the
      # token URL is what activates PKCE in /oauth/start.
      - key: DERIV_OAUTH_AUTHORIZE_URL
        value: https://auth.deriv.com/oauth2/auth
      - key: DERIV_OAUTH_TOKEN_URL
        value: https://auth.deriv.com/oauth2/token
      - key: DERIV_MARKUP_PERCENT
        value: "2"
      # Your referral link (public).
      - key: DERIV_REFERRAL_URL
        value: https://track.deriv.com/_6uqV-95nzXtZl7VyVw174GNd7ZgqdRLk/1/
      # ---- Paid access (membership paywall) ----
      # Master switch: keep "false" until Stripe + ADMIN_KEY are ready, then "true".
      - key: REQUIRE_ACCESS
        value: "false"
      # Owner secret for the /owner code console + /admin/licenses. Set in the
      # dashboard (never commit it).
      - key: ADMIN_KEY
        sync: false
      # Stripe webhook signing secret (whsec_…) — set in the dashboard.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Your Stripe Payment Link (public URL). Set in the dashboard once created.
      - key: ACCESS_BUY_URL
        sync: false
      - key: ACCESS_PRICE_LABEL
        value: "$100"
      - key: ACCESS_DAYS
        value: "90"

  # ---------------- ANALYSER (brain + scanner + comms hub) ----------------
  - type: web
    name: j81-analyser
    runtime: docker
    dockerfilePath: ./analyser-app/Dockerfile
    dockerContext: ./analyser-app
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: j81-analyser-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RESEARCHER_URL
        value: https://j81-researcher.onrender.com
      # Optional: protect the ingest endpoints with a bearer token.
      - key: INCOMING_API_KEY
        sync: false

  # ---------------- RESEARCHER (optional — gathers strategies) ----------------
  - type: web
    name: j81-researcher
    runtime: docker
    dockerfilePath: ./research-app/Dockerfile
    dockerContext: ./research-app
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: j81-researcher-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHONUNBUFFERED
        value: "1"
      # On Gemini (free tier) — set GOOGLE_API_KEY in the dashboard.
      - key: LLM_PROVIDER
        value: google
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Ship the gathered library to the Analyser + obey it as the comms hub.
      - key: LOGGING_APP_URL
        value: https://j81-analyser.onrender.com
      - key: COMMS_HUB_URL
        value: https://j81-analyser.onrender.com
