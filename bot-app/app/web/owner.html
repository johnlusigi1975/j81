<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>J81 · Owner — Membership codes</title>
<style>
  :root{--bg:#0a0e13;--panel:#141c24;--bd:rgba(212,184,122,.22);--text:#f2ecde;--dim:#bab3a3;--faint:#867f72;--amber:#d4b87a;--good:#46cf9e;--bad:#e08585;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 460px at 50% -200px,rgba(212,184,122,.12),transparent 64%),linear-gradient(180deg,#0d141b,#070b10);min-height:100vh;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  h1{font-family:Georgia,serif;font-size:30px;margin:0 0 4px} .sub{color:var(--faint);font-size:13px;margin-bottom:24px}
  .card{background:linear-gradient(180deg,#151d26,#0f161d);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 30px 70px -34px rgba(0,0,0,.85)}
  label{font-size:12px;color:var(--dim);display:block;margin-bottom:5px}
  input{font-family:inherit;font-size:14px;color:var(--text);background:rgba(0,0,0,.32);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .btn{background:linear-gradient(180deg,#f0dcab,#d4b87a 55%,#b3924f);color:#241c0a;font-weight:800;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:14px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--bd)}
  .msg{font-size:13px;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  th{text-align:left;color:var(--faint);font-weight:600;padding:6px} td{padding:7px 6px;border-top:1px solid rgba(255,255,255,.06)}
  code{font-family:var(--mono);background:rgba(0,0,0,.3);padding:2px 7px;border-radius:6px}
  .pill{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
  .copy{cursor:pointer;color:var(--amber);background:none;border:0;font-size:12px}
  .codebox{font-family:var(--mono);background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>J81 · Owner</h1>
  <div class="sub">Mint and manage membership codes. This page never stores your key on the server — it's kept only in this browser.</div>

  <div class="card">
    <label>Admin key</label>
    <div class="row">
      <input id="key" type="password" placeholder="your ADMIN_KEY" style="flex:1;min-width:220px">
      <button class="btn ghost" id="save">Save key</button>
    </div>
    <div class="msg faint" id="keymsg"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 12px">Mint codes</h3>
    <div class="row">
      <div style="flex:1;min-width:120px"><label>How many</label><input id="count" type="number" value="1" min="1" max="500"></div>
      <div style="flex:2;min-width:160px"><label>Note (optional)</label><input id="note" placeholder="e.g. promo / customer name"></div>
      <button class="btn" id="mint">Generate</button>
    </div>
    <div class="msg" id="mintmsg"></div>
    <div id="newcodes"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">All codes</h3><button class="btn ghost" id="refresh">Refresh</button></div>
    <div id="list" class="faint" style="margin-top:8px">enter your key and Refresh</div>
  </div>
</div>
<script>
var $=function(id){return document.getElementById(id);};
function key(){ return localStorage.getItem("j81_admin_key")||""; }
$("key").value=key();
$("save").addEventListener("click",function(){ localStorage.setItem("j81_admin_key",$("key").value.trim()); $("keymsg").textContent="saved in this browser"; load(); });
function H(){ return {"Content-Type":"application/json","X-Admin-Key":key()}; }
async function mint(){
  var n=parseInt($("count").value||"1",10), note=$("note").value||null, m=$("mintmsg");
  if(!key()){ m.innerHTML='<span style="color:var(--bad)">enter your admin key first</span>'; return; }
  m.textContent="generating…";
  try{
    var r=await fetch("/admin/licenses",{method:"POST",headers:H(),body:JSON.stringify({count:n,note:note})});
    var b=await r.json(); if(!r.ok) throw new Error(b.detail||"failed");
    m.innerHTML='<span style="color:var(--good)">✓ created '+b.created+' code(s) · '+b.days+' days each</span>';
    $("newcodes").innerHTML='<div class="codebox" id="cb">'+b.codes.join("\n")+'</div><button class="btn ghost" style="margin-top:8px" onclick="navigator.clipboard.writeText(document.getElementById(\'cb\').innerText)">Copy all</button>';
    load();
  }catch(e){ m.innerHTML='<span style="color:var(--bad)">'+e.message+'</span>'; }
}
async function load(){
  var el=$("list"); if(!key()){ el.textContent="enter your key and Refresh"; return; }
  el.textContent="loading…";
  try{
    var r=await fetch("/admin/licenses",{headers:H()}); var rows=await r.json(); if(!r.ok) throw new Error((rows&&rows.detail)||"failed");
    if(!rows.length){ el.innerHTML='<div class="faint">no codes yet</div>'; return; }
    el.innerHTML='<table><thead><tr><th>Code</th><th>Status</th><th>Days</th><th>Expires</th><th>Note</th><th></th></tr></thead><tbody>'+
      rows.map(function(x){ var col=x.status==="active"?"var(--good)":x.status==="revoked"?"var(--bad)":"var(--faint)";
        return '<tr><td><code>'+x.code+'</code></td><td><span class="pill" style="color:'+col+'">'+x.status+'</span></td><td>'+x.days+'</td><td>'+(x.expires_at?x.expires_at.slice(0,10):'—')+'</td><td class="faint">'+(x.note||'')+'</td><td><button class="copy" onclick="navigator.clipboard.writeText(\''+x.code+'\')">copy</button></td></tr>'; }).join("")+
      '</tbody></table>';
  }catch(e){ el.innerHTML='<span style="color:var(--bad)">'+e.message+'</span>'; }
}
$("mint").addEventListener("click",mint);
$("refresh").addEventListener("click",load);
if(key()) load();
</script>
</body>
</html>
